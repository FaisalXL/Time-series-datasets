# ICS-209-PLUS Wildfire Situation Reports → CPT world-knowledge JSONL
#
# One record = one SITUATION REPORT: that report's own narrative (significant events,
# current threat, projected activity, weather, planned actions) paired with the TRAILING
# window of the incident's DAILY time series (acres burned, percent contained, total
# personnel) ENDING at that report. The narrative *describes* the fire state the series
# quantifies → "describes"; the report's own metrics are the series' terminal point.
#
# License: ICS-209-PLUS (St. Denis et al. 2023) is CC BY 4.0 — open, attribution only.
#
# Quick start:
#   pip install -r requirements.txt
#   python scripts/build_cpt_jsonl.py --dry-run --set output.max_records=3
#   python scripts/build_cpt_jsonl.py                                  # demo (50)
#   python scripts/build_cpt_jsonl.py --set output.max_records=null    # full build

data:
  # ICS-209-PLUS wildfire bundle on figshare (article 19858927, CC BY 4.0). Keyless.
  # The sitrep CSV lives inside this zip; parsed with the stdlib (zipfile/csv).
  wildfire_zip_url: "https://ndownloader.figshare.com/files/38766504"
  sitreps_csv_name: "ics209plus-wildfire/ics209-plus-wf_sitreps_1999to2020.csv"

  # Free-text narrative fields combined (in this order) to form the report prose.
  narrative_fields:
    - SIGNIF_EVENTS_SUMMARY
    - CURRENT_THREAT_NARR
    - PROJECTED_ACTIVITY_NARR
    - WEATHER_CONCERNS_NARR
    - PLANNED_ACTIONS
    - STRATEGIC_NARR
    - REMARKS

  # Numeric channels (CSV column -> channel). A daily point is kept only if ALL are
  # present (no imputation); days missing any are dropped, gaps kept explicit via dates.
  channels:
    - {col: "ACRES", name: "acres_burned", unit: "acres"}
    - {col: "PCT_CONTAINED_COMPLETED", name: "percent_contained", unit: "percent"}
    - {col: "TOTAL_PERSONNEL", name: "total_personnel", unit: "persons"}

  # Trailing window (same pattern as 11_eia_petroleum_weekly). One record per situation
  # report: the series is the last `window_reports` reporting days ENDING at that report,
  # so the report's own metrics are always the series' terminal point. A report needs at
  # least `min_window_reports` of trailing history to be emitted.
  window_reports: 32          # trailing window length in reporting days (= 1 patch @ 32)
  min_window_reports: 21      # a report with fewer trailing points is skipped
  max_records_per_incident: null   # null = uncapped; N spreads N picks across the fire

  # Burned area cannot physically shrink. Inside a "complex", sub-fire re-scoping can make
  # reported ACRES collapse mid-incident (observed down to -100%), which would teach wrong
  # dynamics — those windows are dropped. Small decreases (remapping/GIS corrections) are
  # normal and kept. null disables the check.
  max_acres_drop_frac: 0.25
  cache_dir: ".cache"
  user_agent: "CPT-dataset-research faisal@usc.edu"
  timeout_s: 180

text:
  min_text_chars: 300      # anchor report narrative must be at least this long
  # No templated ts_intro: <ts></ts> is appended directly to the real situation-report
  # narrative, nothing is generated.

output:
  output_path: output/ics209_wildfire_cpt.jsonl
  report_path: output/run_report.json
  samples_path: samples/example_output.jsonl
  max_records: 50          # demo cap. null = full build (all qualifying incidents)
  indent: null
