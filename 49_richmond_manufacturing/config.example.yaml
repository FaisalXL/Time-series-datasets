# Richmond Fed Fifth District Survey of Manufacturing Activity → CPT world-knowledge JSONL
#
# One record = (data month × the release's own narrative block): that block of the release
# prose, verbatim, paired with a trailing 36-month window of exactly the indicators the
# block names, ending on the month the release reports. alignment is measured per record
# ("recites" when the prose quotes a channel's terminal value, else "describes").
# text_quality "real" — nothing in the text is generated; <ts></ts> is appended directly
# to the Bank's own words and provenance lives in meta.
#
# ⚠ THE SERIES IS NOT THE PUBLISHED WORKBOOK. The release's own Technical Notes say why:
#   "Seasonal adjustment factors are recalculated every July and the entire series is
#   revised."  Measured: the value a release printed still equals today's
#   mfg_historicaldata.xlsx in only 27.9% of cells (2018-23: 11-20%; 2026: 100%), median
#   drift 2.0 index points. So the series is the AS-FIRST-PUBLISHED vintage, stitched from
#   each release's own results table. Run `--audit-vintage` to reproduce the number and
#   `--audit-overlap` for the stitch's own consistency check.
#
# One of the Federal Reserve regional business surveys (see docs/fed_surveys_discovery.md).
# Sibling: 50_richmond_nonmanufacturing — same bank, same document shapes, identical
# scripts; everything that differs between them lives in this file.
#
# License: Federal Reserve Bank publications are U.S. public domain / freely reusable.
#
# Quick start:
#   pip install -r requirements.txt        # + poppler (pdftotext)
#   python scripts/harvest.py                                # fetch releases (cached)
#   python scripts/build_cpt_jsonl.py --dry-run --set output.max_records=3
#   python scripts/build_cpt_jsonl.py --set output.max_records=null   # full build

data:
  bank: "Federal Reserve Bank of Richmond"
  survey_title: "Fifth District Survey of Manufacturing Activity"
  district: 5
  domain: "manufacturing"
  region: "US"
  survey_key: "mfg"                 # selects the filename vocabulary in scripts/richsrc.py
  dataset_name: "richmond_manufacturing"
  series_id_prefix: "rich_mfg"
  license_tag: "public-domain-us-gov"

  # canonical originating page (schema v1 `source` must be a URL)
  source_url: "https://www.richmondfed.org/research/regional_economy/surveys_of_business_conditions/manufacturing"

  # The Bank's published (revised) workbook. Used ONLY by --audit-vintage, never as the
  # record series. Cached under its own name so the cache is self-describing.
  data_xlsx_url: "https://www.richmondfed.org/-/media/RichmondFedOrg/region_communities/regional_data_analysis/regional_economy/surveys_of_business_conditions/manufacturing/data/mfg_historicaldata.xlsx"
  workbook_cache_name: "mfg_historicaldata.xlsx"

  # Window: 36 months, the same size 47_philadelphia_mbos and 48_dallas_tmos settled on,
  # and comfortably above the model's 32-point patch. Every emitted channel is exactly
  # this long; a channel over the null budget drops the record rather than being padded.
  window_months: 36
  max_null_fraction: 0.15

  # The data-month convention FLIPPED inside the 2005-2007 gap: a 1997-2004 release
  # reports month M-1 (the January 2000 release tables December 1999), a 2008+ release
  # reports M. Nothing here is used unless a release's table carries no month labels at
  # all — `--audit-convention` measures the rule from the tables' own headings.
  modern_era_start: "2005-01"
  data_month_offset_by_era: {retired: 1, modern: 0}

  cache_dir: ".cache"
  user_agent: "CPT-dataset-research flnu@usc.edu"
  request_delay_s: 0.3
  timeout_s: 60

  # channel → (current-conditions column, six-months-ahead column) in the published
  # workbook. --audit-vintage only; prices are NSA in the workbook, as in the release.
  workbook_columns:
    composite_index:             ["sa_mfg_composite", null]
    shipments:                   ["sa_mfg_ship_c", "sa_mfg_ship_e"]
    new_orders:                  ["sa_mfg_new_orders_c", "sa_mfg_new_orders_e"]
    order_backlog:               ["sa_mfg_bk_logs_c", "sa_mfg_bk_logs_e"]
    capacity_utilization:        ["sa_mfg_cap_util_c", "sa_mfg_cap_util_e"]
    vendor_lead_time:            ["sa_mfg_vend_lead_c", "sa_mfg_vend_lead_e"]
    employment:                  ["sa_mfg_emp_c", "sa_mfg_emp_e"]
    average_workweek:            ["sa_mfg_workwk_c", "sa_mfg_workwk_e"]
    wages:                       ["sa_mfg_wage_c", "sa_mfg_wage_e"]
    capital_expenditures:        ["sa_mfg_capital_expnd_c", "sa_mfg_capital_expnd_e"]
    finished_goods_inventories:  ["sa_mfg_fd_gds_inv_c", "sa_mfg_fd_gds_inv_e"]
    raw_materials_inventories:   ["sa_mfg_raw_mats_inv_c", "sa_mfg_raw_mats_inv_e"]
    local_business_conditions:   ["sa_mfg_local_bus_cond_c", "sa_mfg_local_bus_cond_e"]
    skills_availability:         ["sa_mfg_nec_skls_avail_c", "sa_mfg_nec_skls_avail_e"]
    equipment_software_spending: ["sa_mfg_equip_sftw_expnd_c", "sa_mfg_equip_sftw_expnd_e"]
    services_expenditures:       ["sa_mfg_bus_svcs_expnd_c", "sa_mfg_bus_svcs_expnd_e"]
    prices_paid:                 ["nsa_mfg_pct_chg_prcs_pd_c", "nsa_mfg_pct_chg_prcs_pd_e"]
    prices_received:             ["nsa_mfg_pct_chg_prcs_recd_c", "nsa_mfg_pct_chg_prcs_recd_e"]

text:
  # 120 chars, matching 47_philadelphia_mbos. The 2018+ releases write short paragraphs, so
  # this floor is what most of the dropped block units are; `drop_short_text` in the run
  # report is the exact cost of the choice.
  min_text_chars: 120

output:
  output_path: output/richmond_manufacturing_cpt.jsonl
  report_path: output/run_report.json
  samples_path: samples/example_output.jsonl
  max_records: null                 # null = full build
  indent: null
