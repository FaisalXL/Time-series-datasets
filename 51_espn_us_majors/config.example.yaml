# ESPN US Majors (NBA + NFL + NHL) Game Recaps + Score-Progression Series → CPT
#
# One record = one FINISHED GAME: the real AP wire recap (served via ESPN's API)
# paired with the game's PLAY-BY-PLAY running score (away/home cumulative, one
# point per play -- not per period/quarter; period-level was tried first and
# found far too short, 3-4 points, especially for NFL/NHL where scoring events
# are rare -- play-level is the source's actual finest native granularity and
# gives ~100-500 points depending on league). The recap *describes* the shape
# of the game the series quantifies (comeback, blowout, lead held throughout)
# → "describes". text_quality is always "real"; games with no usable recap are
# dropped (no synthetic fallback).
#
# ⚠️ LICENSE: the recap prose is Associated Press wire copy (article.source == "AP"
#    on every game checked across all 3 leagues) served through ESPN's API — a
#    DIFFERENT and likely STRICTER copyright chain than ESPNcricinfo's own staff
#    writers (compare datasets/45_cricket_report_overseries). The committed
#    output/ + samples/ are a capped 50-record demo for the lead to inspect
#    (internal review, not distribution) — see the README. Keep output.max_records
#    small; do not run/commit a full build or publish until redistribution is
#    cleared with Charon.
#
# Quick start:
#   pip install -r requirements.txt
#   python scripts/build_cpt_jsonl.py --dry-run --set output.max_records=5
#   python scripts/build_cpt_jsonl.py

data:
  # ESPN's own site API (not a bulk archive — no equivalent of Cricsheet's zip).
  # Same parent host Cricket uses; each sport is its own path segment. Scoreboard
  # resolves by date; summary resolves by event id.
  #
  # 2026-08-12: host moved. site.api.espn.com now returns 403 (Akamai) for every UA
  # including browser ones — verified against this package's own NFL scoreboard call,
  # not just cricket's. site.web.api.espn.com serves the identical payload and accepts
  # our identifying research UA, so no spoofing. ⚠️ Everything this package claims about
  # coverage and scale was scouted through the dead host and is therefore UNVERIFIED —
  # see #45, whose ceiling was wrong by 14× until it was actually measured.
  leagues:
    - {sport: "basketball", league: "nba", label: "NBA"}
    - {sport: "football", league: "nfl", label: "NFL"}
    - {sport: "hockey", league: "nhl", label: "NHL"}
    # MLB is deliberately NOT here, on a measurement rather than an oversight. Probed
    # 2026-08-12: 2,982 finished games in calendar 2024, but recap coverage is **2.5%** (1 of 40
    # sampled) -- the summary payload has no `article` key at all on 39 of 40 games. Its series
    # half is the richest of any league checked (413 plays, 69 win-probability points), so the
    # gap is the TEXT, which is backwards from the "~17.2k" scouting claim. Realistic yield is
    # ~900 records for a ~36k-game harvest. `_flatten_plays` already handles MLB's flat `plays`
    # shape, so adding it is one line here if those ~900 are wanted -- but it is not free, and
    # it perturbs an in-flight harvest.
    #
    # ESPN soccer is not addable at all: no `plays`, no `winprobability`, and a scoreline off
    # `keyEvents` is 2-6 points -- under min_plays below, and under the window floor. Its
    # rightsholders are also Reuters (EPL/UCL) and Field Level Media (MLS), i.e. NEW licence
    # asks rather than this package's AP one. College football and D-I basketball ARE viable and
    # live in 65_espn_college; see that README for all three measurements.

  scoreboard_url: "https://site.web.api.espn.com/apis/site/v2/sports/{sport}/{league}/scoreboard?dates={date}"
  summary_url: "https://site.web.api.espn.com/apis/site/v2/sports/{sport}/{league}/summary?event={event_id}"

  # Event discovery. Two paths:
  #
  #  (a) event_ids_file — a pre-built id list. Set this for full-scale runs. Discovery
  #      becomes instant (0.2 s vs 3.4 h) because it skips the scoreboard walk entirely.
  #      Format: {event_id: [league, "YYYY-MM", status], ...}. Build one with a monthly
  #      range query per league — but ONLY with `&limit=1000`: without it the range
  #      endpoint silently truncates at 100 events and still returns HTTP 200 (NBA
  #      Jan 2024 returns 100 of 233 real games), i.e. a 57% undercount that looks like
  #      a successful call. With the limit it reproduces a day-by-day walk exactly.
  #      Measured universe 2014-07 -> 2026-08: 36,659 finished games
  #      (NBA 15,699 / NFL 3,939 / NHL 17,021).
  #
  #  (b) start_date/end_date — the day-by-day scoreboard walk. Fine for a demo window;
  #      at full scale it is 4,425 days x 3 leagues = 13,275 requests (~3.4 h) spent
  #      before a single record is emitted.
  #
  # ⚠️ A capped run (`max_records`) takes ids in sorted order = roughly OLDEST first, and
  #    recap coverage is era-skewed, so a capped build is NOT a random sample.
  discovery:
    event_ids_file: null     # e.g. ".cache/event_universe.json" — takes precedence when set
    start_date: "20260101"   # YYYYMMDD, inclusive -- Jan covers NFL playoffs too
    end_date: "20260320"     # YYYYMMDD, inclusive -- through mid NBA/NHL season
    step_days: 1

  request_delay_s: 0.4       # be polite: ~2-3 req/s, cached per event_id
  cache_dir: ".cache"
  user_agent: "CPT-dataset-research faisal@usc.edu"
  timeout_s: 90

  min_periods: 3              # drop games with fewer than this many periods of play data
                               # (NHL regulation=3, NBA/NFL regulation=4; OT adds more)
  min_plays: 20                # drop games with a suspiciously thin play-by-play feed

text:
  # No templated ts_intro: <ts></ts> is appended directly to the real recap prose,
  # nothing is generated.
  min_report_chars: 400   # drop games whose recap is missing or too short

output:
  output_path: output/espn_us_majors_cpt.jsonl
  report_path: output/run_report.json
  samples_path: samples/example_output.jsonl
  max_records: 50         # demo cap — see LICENSE note above. null = uncapped (do not use pre-clearance).
  indent: null
