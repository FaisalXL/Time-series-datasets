# UK ONS statistical bulletins -> CPT world-knowledge JSONL
#
# One record = ONE CONTIGUOUS RUN OF PARAGRAPHS from one analytical section of one bulletin
# edition: that run's own VERBATIM prose paired with the trailing multi-channel window of the
# indicator series the bulletin family reports. The prose RECITES the numbers ("CPIH rose by
# 2.8% in the 12 months to June 2026, down from 3.0% the previous month") -> alignment =
# "recites", evidence-checked per claim, never assumed.
#
# There is no `families:` block any more, and that is the point. The demo hand-wired CDIDs per
# family, which shipped the WRONG VARIANT for retailsales (the bulletin quoted an online-sales
# share of 29.4% while the wired CDID j4mc read 28.3%) and could never have covered the 495
# families ONS publishes. Channels are now DISCOVERED from the prose's own figures by
# `scripts/discover_channels.py`, which proves each family against a month-shifted control and
# writes channels.json. Editions come from census.json (the ONS search API, 5,788 editions).
#
# License: Open Government Licence v3.0 -- ONS's own terms state OGL v3 is interoperable with
# CC BY 4.0, so `cc-by-4.0` is the closest-fit schema tag; the true grant is in
# meta.true_license (same convention as INSEE #57 Etalab and RBNZ #60).
#
# Quick start:
#   pip install -r requirements.txt
#   python scripts/build_census.py                     # 495 families / 5,788 editions
#   python scripts/discover_channels.py                # -> channels.json (+ control ratios)
#   python scripts/build_cpt_jsonl.py --dry-run
#   python scripts/build_cpt_jsonl.py                  # full build

data:
  # Enumeration and channel sets, both produced by scripts in this package. Paths are relative
  # to the package root.
  census: census.json
  channels: channels.json

  # NOTE on access, encoded in scripts/onsfetch.py rather than here, because it must hold
  # across processes: ONS allows a burst of ~5 requests and then hard-429s, and the penalty
  # persists ~30s. The limiter is therefore a lock-file shared by every process, and a 429 is
  # NEVER cached -- a throttle body is 17 bytes and caching it would bake "the source has
  # nothing here" into the corpus.

series:
  freq: "1M"              # 1M = one MONTH. (1m = one MINUTE -- see README "freq token" note.)
  window_months: 36       # >32, per the 2026-08-03 meeting floor. Sources hold 450+ months.
  # A channel needs this many NON-NULL points in the window or it is dropped from the record.
  # Gaps inside the window are emitted as explicit nulls (the schema allows them) rather than
  # imputed, and rather than dropping an otherwise good channel for one missing month.
  min_points: 24

text:
  # ---- the 500-token cap (2026-08-03 meeting) -------------------------------------------
  max_chars: 2000         # ~500 tokens at ~4 chars/token
  min_chars: 300          # below this a chunk is a stub -> dropped

  # A section longer than the cap is SPLIT into consecutive whole-paragraph runs, each its own
  # record -- it is not truncated. The demo kept only the densest run per section and discarded
  # ~70% of real first-party prose (measured compression 3.4x). Truncating a `recites` record
  # also orphans the numbers that fall after the cut, so the remainder must be shipped, not
  # dropped. Text stays 100% VERBATIM either way; nothing is ever rewritten.

  # Abstractive LLM summarization (rewriting the source into <=500 tokens) is NOT enabled. It
  # is blocked on a SCHEMA change, not on this script: schema/validate.py allows only
  # text_quality in {"real","generated"} -- there is no `llm_summarized` value, and "generated"
  # would wrongly conflate a grounded summary of a real document with fully synthetic text.
  # See README "The LLM question". Setting this true raises a clear error.
  abstractive_summary: false

  # Boilerplate sections -- never analytical prose about the series.
  exclude_anchors:
    - glossary
    - data-sources-and-quality
    - related-links
    - cite-this-statistical-bulletin
    - measuring-the-data
    - strengths-and-limitations
    - future-developments
    - collaboration
    - related-publications
    - authors
    - acknowledgements
    - contact-details
    - notes

  # A chunk must carry at least this many TYPED figures (%, pp, £, million, points) to qualify
  # as analytical. This is a second, self-enforcing gate that drops boilerplate the anchor list
  # misses. "Typed" matters: an untyped number sweep turned 520 real claims into 2,815, of
  # which 2,295 were years, list indices and "12 months" -- noise that buried the signal.
  min_figures: 2

  # Near-duplicate ceiling on same-section, same-chunk-index text within a family. ONS reuses
  # sentence templates month to month ("The 12-month rate for X was Y% in <month>, down from
  # Z%"); measured 0.806 between consecutive editions of the same section, so 0.93 drops
  # genuine near-copies without touching normal template reuse. Exact duplicates are always
  # dropped by hash. null disables.
  max_similarity: 0.93

  # A verbatim superlative contradicted by its own paired data is a real risk (caught on FAS
  # GAIN #58) -- but auto-dropping here is UNSAFE and is off by default. In the demo EVERY
  # "contradiction" was a false positive from channel mis-attribution. Superlatives are checked
  # and flagged in meta.superlative_flags instead, using the same naming rule as the evidence
  # pass, so a claim is only checked against a series the sentence actually names.
  drop_on_superlative_contradiction: false

output:
  path: output/ons_bulletins_cpt.jsonl
  run_report: output/run_report.json
  samples_path: samples/example_output.jsonl

  # Per-family cap, for smoke runs. null = build every edition of every shippable family.
  max_records_per_family: null

  # THE ACCEPTANCE GATE. A family whose prose does not measurably recite its own channels does
  # not ship. Measured on the demo: consumerpriceinflation 2.95 evidence claims/record (channels
  # are the right variants) vs retailsales 0.25 (two of three hand-picked CDIDs were the wrong
  # variant). A family near zero has a channel-mapping problem, not a text problem.
  min_evidence_per_record: 1.0
