# Destatis (German Federal Statistical Office) English press releases -> CPT world-knowledge JSONL
#
# One record = one Destatis ENGLISH press release's own VERBATIM prose paired with the trailing
# multi-channel window of the harmonised index it reports. The prose RECITES the numbers, and
# recites SEVERAL CONSECUTIVE MONTHS in one sentence -- e.g. "the inflation rate ... was +2.3% in
# June 2026 ... after having stood at +2.6% in May 2026 and +2.9% in April 2026" -- so a single
# record can be evidence-checked against three separate points of its own paired series.
#
# ---- WHY THE SERIES COMES FROM EUROSTAT, NOT DESTATIS ----------------------------------------
# Destatis's own series live in GENESIS-Online, whose REST API needs a (free) registered key --
# verified: keyless requests return HTTP 405, and the web UI is a JS app. Rather than gate the
# whole package on a credential, the series side uses Eurostat's KEYLESS dissemination API for
# GERMANY's HICP.
#
# This is a cross-source join, so it is only legitimate for ONE specific claim: the release states
# BOTH the national CPI and the HARMONISED index (HICP), and Eurostat publishes exactly that
# harmonised series as Germany reports it. So the evidence matcher targets the HICP sentence and
# must NOT credit an HICP channel with the national-CPI figure -- they genuinely differ
# (June 2026: CPI +2.3% vs HICP +2.4%). Guarded below.
#
# ---- MEASURED SCALE --------------------------------------------------------------------------
# Wayback CDX over destatis.de/EN/Press/: 2,845 distinct English releases, 2010->2026, across ~12
# recurring indicator families (subject codes: 421 industrial production, 611 consumer prices,
# 51 foreign trade, 811 national accounts, 61241/61281 producer & import prices, 45212 turnover,
# 12621 unemployment, ...). Peak capture years run 562 (2021) / 536 (2022) releases, so 2,845 is a
# FLOOR, not a total -- Destatis's own listing is JS-driven and its archive endpoints 404, which is
# why CDX is the enumerator here (the site cannot be walked).
# Subject 611 alone yields 48 releases across 2024-2025 -- ~24/yr, because each reference month
# gets a provisional flash estimate AND a final confirmation.
#
# License: press releases -- "Reproduction and distribution, also of parts, are permitted provided
# that the source is mentioned" (attribution-only). GENESIS data -- Data licence Germany
# attribution 2.0 (DL-DE-BY-2.0). Eurostat -- permissive reuse w/ attribution. No NC clause,
# no permission gate. Tagged `cc-by-4.0` closest schema fit; real terms in meta.true_license.
#
# Quick start:
#   pip install -r requirements.txt
#   python scripts/build_cpt_jsonl.py --dry-run
#   python scripts/build_cpt_jsonl.py
#   python scripts/build_cpt_jsonl.py --set output.max_records=null

data:
  release_url: "https://www.destatis.de/EN/Press/{year}/{month}/{slug}.html"
  # Eurostat keyless dissemination API (no key, no login -- verified).
  eurostat_url: "https://ec.europa.eu/eurostat/api/dissemination/statistics/1.0/data/{dataset}"
  cache_dir: ".cache"
  user_agent: "CPT-dataset-research faisal@usc.edu"
  timeout_s: 120
  retries: 4
  min_interval_s: 2.0

  geo: DE

  # Channels: Germany's HICP from Eurostat. Every one VERIFIED live (dataset/coicop/unit + month
  # count), not guessed -- 348-360 monthly points back to 1996-97.
  # `keywords` must appear in a figure's OWN CLAUSE for that figure to be credited to the channel.
  # `reject_terms` block a clause that is talking about a different series.
  channels:
    - {dataset: prc_hicp_manr, coicop: CP00,  unit: RCH_A, name: hicp_annual_rate_pct,
       keywords: ["harmonised", "HICP"], reject_terms: ["core", "excluding"]}
    - {dataset: prc_hicp_mmor, coicop: CP00,  unit: RCH_M, name: hicp_monthly_rate_pct,
       keywords: ["harmonised", "HICP"], reject_terms: ["core", "excluding"]}
    - {dataset: prc_hicp_midx, coicop: CP00,  unit: I15,   name: hicp_index_2015_100,
       keywords: ["harmonised", "HICP"], reject_terms: []}
    - {dataset: prc_hicp_manr, coicop: CP01,  unit: RCH_A, name: hicp_annual_rate_food_nonalc_pct,
       keywords: ["food"], reject_terms: ["excluding"]}
    - {dataset: prc_hicp_manr, coicop: CP04,  unit: RCH_A, name: hicp_annual_rate_housing_energy_pct,
       keywords: ["housing"], reject_terms: []}
    - {dataset: prc_hicp_manr, coicop: CP045, unit: RCH_A, name: hicp_annual_rate_electricity_gas_fuels_pct,
       keywords: ["electricity", "gas", "energy"], reject_terms: []}
    - {dataset: prc_hicp_manr, coicop: CP07,  unit: RCH_A, name: hicp_annual_rate_transport_pct,
       keywords: ["transport"], reject_terms: []}
    - {dataset: prc_hicp_manr, coicop: CP11,  unit: RCH_A, name: hicp_annual_rate_restaurants_hotels_pct,
       keywords: ["restaurant", "hotel", "catering"], reject_terms: []}

  # Demo releases (subject code 611 = consumer prices), enumerated from the CDX sweep.
  # Eurostat's German HICP currently ends 2025-12 (last updated 2026-02-06 -- a REAL lag, verified,
  # not a query artifact), so demo editions are chosen from 2024-2025 where the series exists.
  # A full run should either accept that lag or switch the series side to GENESIS with a key.
  releases:
    - {year: 2024, month: "01", slug: PE24_003_611}
    - {year: 2024, month: "01", slug: PE24_020_611}
    - {year: 2024, month: "01", slug: PE24_042_611}
    - {year: 2024, month: "02", slug: PE24_051_611}
    - {year: 2024, month: "02", slug: PE24_078_611}
    - {year: 2024, month: "03", slug: PE24_094_611}
    - {year: 2024, month: "04", slug: PE24_133_611}
    - {year: 2024, month: "04", slug: PE24_150_611}

series:
  freq: "1M"              # 1M = one MONTH (1m would be one MINUTE -- see README)
  window_months: 36       # >32; sources hold 348-360 months
  min_points: 32

text:
  max_chars: 2000         # ~500 tokens, the 2026-08-03 cap
  min_chars: 300
  # Contiguous whole-paragraph selection in source order -- text stays 100% VERBATIM.
  #   numeric_density  -- the contiguous run with the most verifiable figures (default)
  #   head             -- leading paragraphs until the cap
  selector: numeric_density
  # Abstractive summarization stays OFF: schema/validate.py has no `llm_summarized`
  # text_quality value, and "generated" would mislabel a grounded summary as synthetic.
  abstractive_summary: false

  # Destatis releases open with a machine-styled bullet block ("Consumer price index, June 2026:
  # +2.3% on the same month a year earlier") before the WIESBADEN-datelined narrative. Those
  # bullets are verbatim source but are a key-value dump, not prose -- dropped by requiring a
  # minimum word count and terminal punctuation.
  min_words: 18
  drop_chrome: true
  max_similarity: 0.93
  drop_on_superlative_contradiction: false   # flag only -- see README (ONS #61 lesson)

output:
  # NOT a shippable demo -- see README. Deliberately NOT named *_cpt.jsonl so a bulk
  # `datasets/*/output/*_cpt.jsonl` corpus glob cannot pick these records up.
  path: output/NOT_SHIPPABLE_negative_result.jsonl
  run_report: output/run_report.json
  samples_path: samples/NOT_SHIPPABLE_negative_result.jsonl
  max_records: null
