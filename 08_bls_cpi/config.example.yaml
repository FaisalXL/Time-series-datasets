# BLS CPI -> CPT world-knowledge JSONL
#
# One record = (data month x narrative section of that month's CPI news release).
#
# Quick start:
#   pip install -r requirements.txt
#   python scripts/fetch_all.py            # harvest every release document (Wayback)
#   python scripts/cpi_series.py           # pull + cache the CPI series from the BLS API
#   python scripts/build_cpt_jsonl.py      # build
#
# Override config:
#   python scripts/build_cpt_jsonl.py --set output.max_records=50
#   python scripts/build_cpt_jsonl.py --set data.window_months=60

data:
  # Release documents harvested by scripts/fetch_all.py. bls.gov itself 403s automated
  # access (verified), so every document comes from web.archive.org. 389 release dates
  # are on disk = 389 distinct data months, 1994-01 .. 2026-06.
  releases_dir: .cache/releases
  fetch_log: .cache/probe/fetch_log.json

  # BLS public API v1 - no key required, but 25 series/request, 10 years/request and
  # 25 requests/day/IP. Responses are cached under api_cache_dir so reruns are free.
  # 64 series x 5 decade chunks = 15 requests for a cold cache.
  api_cache_dir: .cache/api
  api_start_year: 1984      # window_months before the first data month (1994-01)
  api_end_year: 2026
  allow_network: true       # false = fail instead of calling the API

  # Trailing window: each section is paired with the N monthly index levels ending on
  # the month that section reports. 120 = ten years, comfortably above the model's
  # 32-point patch, and long enough to hold a full inflation cycle.
  window_months: 120

  # A channel is dropped unless it has a value for the reported month AND covers at
  # least this fraction of the window. Several component indexes start mid-history
  # (communication 1998-01, personal care 1999-01, C-CPI-U 1999-12).
  min_channel_coverage: 0.6

text:
  # Drop a section with less than this many characters of its own prose. The terse
  # one-paragraph groups (apparel, recreation, other goods and services) sit near
  # this floor; 150 keeps them and drops only the degenerate one-sentence cases.
  min_text_chars: 150

output:
  output_path: output/bls_cpi_cpt.jsonl
  report_path: output/run_report.json
  samples_path: samples/example_output.jsonl

  # null = full build. Set an integer for a smoke test (reconcile check is skipped).
  max_records: null
