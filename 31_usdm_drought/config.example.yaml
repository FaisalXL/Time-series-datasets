# US Drought Monitor (USDM) → CPT world-knowledge JSONL
#
# One record = ONE REGION SECTION of one weekly USDM release: that section's own
# prose from the National Drought Summary, paired with only that region's
# drought-area series over a trailing window ending on the week it reports.
#
# Quick start:
#   python scripts/harvest.py                 # fill .cache/ (narratives + series)
#   python scripts/build_cpt_jsonl.py --set output.max_records=null
#
# Override config:
#   python scripts/build_cpt_jsonl.py --set data.window_weeks=104
#   python scripts/build_cpt_jsonl.py --dry-run

data:
  # Trailing window length, in weekly points, ending ON the week the section
  # reports. 260 = 5 years, matching 11_eia_petroleum_weekly (the other weekly
  # package). Every emitted record carries exactly this many points; weeks with
  # less than a full window of history behind them (the first 259 weeks, i.e.
  # 2000-01-04 .. 2004-12-21) are skipped rather than emitted short.
  window_weeks: 260

  # Cached USDM statistics API responses, written by scripts/harvest.py:
  #   area_{1..6}.json / dsci_{1..6}.json  RegionalClimateCenterStatistics
  #   area_us.json     / dsci_us.json      USStatistics (CONUS)
  # aoi 1..6 = High Plains, Midwest, Northeast, South, Southeast, West -- the six
  # official USDM regions, which are exactly the narrative's section headings.
  api_cache_dir: ".cache/api_rcc"

  # statisticsType 1 = cumulative (D0 includes D1-D4). Set in harvest.py.
  statistics_type: 1

text:
  # Drop a section whose prose is shorter than this.
  min_text_chars: 200

  # Also emit one national record per week from the <intro> ("Summary") section,
  # paired with the CONUS series. Weeks before ~2005 have no <intro> element.
  emit_national_summary: true

  # No ts_intro_sentence. <ts></ts> is appended directly to the real section
  # prose -- nothing in the text is written by this script.

output:
  # Federal-byline records (public-domain-us-gov).
  output_path: output/usdm_drought_cpt.jsonl
  # Weeks with any NDMC/DRI/university author, held as proprietary-review
  # pending NDMC permission. Same shape; no rework needed if permission lands.
  quarantine_path: output/usdm_drought_quarantine.jsonl
  report_path: output/run_report.json

  # Demo cap on the shippable bucket. null = full build.
  max_records: null
