# Copernicus C3S Monthly Climate Bulletin → CPT world-knowledge JSONL
#
# Two record types (one per theme), one record per month per theme:
#   - temperature: surface-air-temperature narrative + 2 channels (global/European
#     anomaly), EXPANDING window = the full monthly series from its start through the
#     release month (freq 1m).
#   - sea_ice: sea-ice-cover narrative + 2 channels (Arctic/Antarctic extent anomaly),
#     this-calendar-month-across-years, full history to the report year (freq 1y) —
#     matches the ranking prose.
#
# Quick start:
#   pip install -r requirements.txt
#   python scripts/build_cpt_jsonl.py --dry-run --set output.max_records=4
#   python scripts/build_cpt_jsonl.py
#   python scripts/build_cpt_jsonl.py --set output.max_records=null   # full build

data:
  # Bulletins exist from ~2017, but the consistent 1991-2020-baseline CSVs span
  # ~2019 (sea ice) / ~2021 (temperature) → present, across two file-naming eras
  # (current C3S_Bulletin_* and mid-era ts_1month/ts_{Month}_anomaly_*). CSV hrefs
  # are discovered from each page's HTML, so both eras are handled automatically.
  # The whole bulletin calendar. The banked build started 2019-01 and so lost 41
  # months; the earliest bulletin of any theme is 2015-08 (see scripts/c3ssrc.py).
  first_month: "2015-01"
  start_month: "2015-01"
  end_month: null            # null = current month

  base_url: "https://climate.copernicus.eu"

  # Which themes to emit. Each is its own record type.
  themes: ["temperature", "sea_ice", "hydrological"]

  # temperature: EXPANDING window — each release is paired with the full monthly
  # anomaly series from its start through the release month (no fixed trailing slice).
  # sea_ice: number of trailing years for the this-month-across-years series
  # (null = all available years, 1979 → report year; already effectively full-history).
  sea_ice_window_years: null


  # --- identity + provenance (config-driven so the builder carries no package identity)
  provider: "Copernicus Climate Change Service (C3S) / ECMWF"
  bulletin_name: "C3S Climate Bulletin"
  dataset_name: "copernicus_climate_bulletin"
  series_id_prefix: "c3s"
  region: "GLOBAL"
  license_tag: "cc-by-4.0"
  true_license: "Copernicus licence (free reuse with attribution to C3S/ECMWF)"

  # --- window policy. Every family lands >= min_points, so a record is never shorter than
  # the model's 32-point patch. Annual-stride families (calendar-month temperature, sea-ice
  # extent) use their whole record, which is 47-87 points and is what the ranking prose is
  # about; monthly and daily families take a trailing slice.
  window_months: 120
  window_days: 365
  min_points: 32
  max_null_fraction: 0.10
  # A record's series must end on the month its bulletin reports. Bulletins occasionally
  # link an earlier month's figure CSV alongside their own, and without this the prose of
  # one month would be paired with a terminal point from another.
  require_terminal_is_reported_month: true

  html_cache_dir: ".cache/html"
  csv_cache_dir: ".cache/csv"
  request_delay_s: 1.0
  timeout_s: 30

text:
  # Drop records with fewer than this many narrative characters.
  min_text_chars: 200
  # No templated ts_intro: <ts></ts> is appended directly to the real scraped narrative,
  # nothing is generated.

output:
  output_path: output/copernicus_climate_bulletin_cpt.jsonl
  report_path: output/run_report.json
  samples_path: samples/example_output.jsonl
  max_records: null          # null = full build
  indent: null
