# ESPN college sports (FBS football + D-I men's/women's basketball) Game Recaps
# + Score-Progression Series -> CPT
#
# One record = one FINISHED GAME: the real wire-service recap (served via ESPN's API) paired
# with the game's PLAY-BY-PLAY running score (away/home cumulative, one point per play). The
# recap describes the shape of the game the series quantifies -> alignment = "describes".
# text_quality is always "real"; games with no usable recap are dropped (no synthetic fallback).
#
# Sibling of 51_espn_us_majors (NBA/NFL/NHL). Same endpoints, same play-extraction logic, same
# rightsholder question. Built through schema/emit.py so records are born strict-clean.
#
# ⚠️ LICENSE: recap prose is Associated Press wire copy served via ESPN's API — the SAME
#    rightsholder as 51, and a different (likely stricter) chain than
#    45_cricket_report_overseries, which is ESPNcricinfo's own staff journalism. Every record is
#    tagged `proprietary-review`. The committed output/ + samples/ are a capped demo for the lead
#    to inspect (internal review, NOT distribution). Do not scale or publish until redistribution
#    is cleared with Charon. Scope the ask to AP and it covers 51 + this package together.
#
# Quick start:
#   pip install -r requirements.txt
#   python scripts/build_cpt_jsonl.py --dry-run --set data.discovery.end_date=2024-11-10
#   python scripts/build_cpt_jsonl.py --set output.max_records=50

data:
  # 2026-08-12: site.api.espn.com returns 403 (Akamai) for every UA including browser ones.
  # site.web.api.espn.com serves the identical payload and accepts our identifying research UA,
  # so no spoofing. This is the host 51 was moved to on the same day.
  # NOTE: no `&limit=` here. That param belongs to the monthly RANGE queries 51_espn_us_majors
  # uses, and on a single-date college-football query it TRUNCATES: see the leagues block below.
  scoreboard_url: "https://site.web.api.espn.com/apis/site/v2/sports/{sport}/{league}/scoreboard?dates={date}"
  summary_url: "https://site.web.api.espn.com/apis/site/v2/sports/{sport}/{league}/summary?event={event_id}"

  user_agent: "CPT-dataset-research flnu@usc.edu"
  timeout_s: 60
  request_delay_s: 0.45          # ~2.2 req/s, the rate the cricket harvest sustained
  cache_dir: ".cache"

  # A game needs this much play-by-play or the series is too short to describe.
  # 2 rather than 51's 3 because basketball is halves at this level, not quarters.
  min_periods: 2
  min_plays: 20

  # Cumulative score channels are monotonised (running max) because ESPN's per-play score fields
  # are not reliable: administrative plays can carry a stale pre-score value, and some carry a
  # value from an unrelated point in the game (event 401706896 reports a=57 h=86 inside a 68/92
  # neighbourhood). Raw, that made the "cumulative" score DECREASE on 9 of the first 50 records.
  # `meta.score_fix_plays` records how many plays were corrected per game.
  #
  # This knob would drop a game whose feed needed correcting on more than this FRACTION of its
  # plays, and it is DELIBERATELY OFF. Set to 0.02 it dropped a real record (event 401729745: 4
  # stale plays out of 180 = 2.2%) for a defect that monotonising already fixes correctly, and it
  # penalises football structurally -- ~180 plays with frequent timeouts vs basketball's ~330, so
  # the same handful of stale administrative plays is a 2x larger fraction. An unmeasured filter
  # like this is what capped #55 at 50 records. The real guard is the official-final check, which
  # is principled: a wrong score value that survives monotonisation lands on the last point and
  # fails there. Turn this on only once the harvest's score_fix_plays distribution actually shows
  # a broken-feed tail worth cutting -- the run report carries the distribution for that decision.
  #
  # 2026-08-12, set from that distribution over the first 4,453 harvested CFB records: p50 0.005,
  # p90 0.040, p99 0.155, then a thin tail running 0.32 -> 0.95. The tail is real -- a game where
  # 95% of plays report a score below the carried one has a mostly-garbage score field, and
  # monotonising it yields a staircase that reaches the final early and sits there, so the PATH is
  # wrong even though the endpoint still matches. 0.25 sits above p99 and below that tail, and
  # costs 0.63% of records. It is a measured cut, not a round number.
  max_score_fix_frac: 0.25

  # Outlier guard on total plays, per sport, from the same measurement:
  #   football   n=5,241  p50 184  p99 241  p99.9 267  then ONE payload at 1,493
  #   basketball n=  329  p50 327  p99 ~500 p99.9 ~600 max 782 (legitimate multi-overtime)
  # Event 400756912 (Miami-FAU 2015) is the 1,493: its period 3 alone holds 1,346 plays against
  # 51/60/36 for the other three, all with unique ids. The play list is corrupt, and it still
  # passes the official-final check, so this is the guard that catches it.
  #
  # Note what was tried and REJECTED as a guard: requiring the play list to be ordered by
  # sequenceNumber. 2,002 of 5,141 cached football payloads (39%) are non-monotone, concentrated in
  # pre-2010 ids -- that is a sequence-numbering convention difference, not a 39% corruption rate.
  max_plays_by_sport:
    football: 500
    basketball: 1200

  # ---- leagues ----------------------------------------------------------------------------
  # `params` is PER LEAGUE and is not cosmetic. Full matrix, re-measured 2026-08-12 with retries
  # (completed games returned, HTTP 200 in every cell — none of these announce the undercount):
  #
  #   CFB  2024-10-26 : bare 52 | groups=80 52 | limit=100/200/500 52 | **limit=1000 -> 25**
  #   MCB  2024-02-10 : bare 21 | groups=50 155 | groups=50&limit=1000 155
  #   WCB  2024-02-10 : bare  7 | groups=50 116
  #
  # Two separate traps, in opposite directions:
  #   * `&limit=1000` — the fix for 51's monthly RANGE queries — HALVES a single-date CFB result.
  #     It was hardcoded into the shared scoreboard_url here, so every CFB discovery call this
  #     package made was truncated; that is where the "exactly 25 games on an October Saturday"
  #     came from. No limit param at all is correct for a day walk. limit<=500 is also harmless,
  #     but there is no reason to send it.
  #   * `&groups=50` (Division I) is MANDATORY for basketball: 7x undercount for men, 16x for
  #     women without it.
  # Football needs no group filter: bare == groups=80 (FBS). `groups=81` returns a DIFFERENT 60
  # games (FCS) — a separate tier that bare does NOT include, so FCS is an expansion option, not a
  # gap in these numbers.
  # FCS is a real fourth tier, not a duplicate of CFB. Measured on 2024-10-26: `bare` and
  # `groups=80` return the IDENTICAL 52 event ids (so the default slate is FBS), while `groups=81`
  # returns 60 games of which only 5 overlap -- 55 games the package was not seeing at all. And
  # they carry the same journalism: 13 of 14 sampled FCS games have an AP recap, median ~2,300
  # chars (shorter than FBS's 5,000-9,000 but far above the 400-char floor).
  #
  # `exclude_overlap_with` is required, not optional. Those 5 shared games would otherwise be built
  # twice with an IDENTICAL series_id (espn_college-football_<event_id> does not encode the tier),
  # which is a duplicate record, not a duplicate row to be resolved later.
  leagues:
    - {sport: "football",   league: "college-football",          label: "CFB", params: ""}
    - {sport: "football",   league: "college-football",          label: "FCS", params: "&groups=81",
       exclude_overlap_with: "CFB"}
    - {sport: "basketball", league: "mens-college-basketball",   label: "MCB", params: "&groups=50"}
    - {sport: "basketball", league: "womens-college-basketball", label: "WCB", params: "&groups=50"}

  # ---- discovery --------------------------------------------------------------------------
  # Day-by-day walk. There is no range-query shortcut here: college basketball 404s on every
  # monthly date range tried, while single dates work. That is the opposite of 51, whose census
  # uses monthly ranges — so budget one request per day per league.
  #
  # ---- what era is even usable ------------------------------------------------------------
  # `census.py --mode era` over 2006-2025 (20 seasons x 3 leagues x 6 sampled days, 666 requests,
  # zero throttles) found a SHARP boundary: the 2012 season is the first with wire recaps, in all
  # three leagues simultaneously. 2006-2011 serve full play-by-play (150-350 plays/game) and no
  # prose at all. So play-by-play does NOT bound this package — recaps do, and the usable window
  # is 2012-2025 (14 seasons).
  #
  # Games per day in the dense middle of a season, mean over the 14 usable seasons:
  #   CFB 8.5/day   MCB 50.3/day   WCB 47.7/day
  # The basketball universe is an order of magnitude larger than football's: D-I is ~360 teams per
  # sex playing ~30 games each. See output/census_walk.json for the exact per-season counts.
  discovery:
    # A window where all three leagues are in season, so a demo build touches every code path.
    start_date: "2024-12-01"
    end_date: "2024-12-14"
    step_days: 1

    # Preferred at scale: read event ids straight out of the cached `census.py --mode walk` cells
    # instead of re-walking the scoreboard (the walk is the expensive half -- ~490 requests per
    # season per league -- and it is already paid for). A list of season start-years, e.g.
    # [2012, 2013]; null falls back to the start_date/end_date walk above. Only whole season cells
    # exist on disk, so this cannot inherit a throttled undercount.
    census_seasons: null

text:
  min_report_chars: 400

  # ---- the automated-content filter -- ON by default, and load-bearing -------------------
  # Measured 2026-08-12 on 40-game random samples:
  #   men's basketball 2023-25 : Data Skrive 26 / AP 11 / no recap 3   (median story 1,653 chars)
  #   men's basketball 2016-19 : Associated Press 39 / no recap 1
  #   college football 2024    : AP 33 / no recap 7                    (stories 5,359-9,579 chars)
  #
  # "Data Skrive" is automated content. SCHEMA.md §7 disqualifies template/boilerplate text, and
  # shipping it would otherwise require `text_quality: generated` plus sign-off — the same gate
  # 05_fnspid is stuck behind, and the semi-synthetic text Xinyue rejected. So it is filtered on
  # the publisher's own `article.source` field, never inferred from the prose. Because the machine
  # copy is a post-2021 phenomenon, this costs little on historical seasons and a lot on recent
  # ones — which is the honest shape of the opportunity.
  #
  # Set to null to disable the filter and keep every source (records still record their source in
  # meta.report_source, so the split stays auditable).
  source_allowlist: ["AP", "Associated Press"]

output:
  path: output/espn_college_cpt.jsonl
  run_report: output/run_report.json
  samples_path: samples/example_output.jsonl
  # Demo caps. Keep these small: the committed artifacts are for internal review, not
  # distribution. The per-league cap exists so the demo covers all three leagues -- leagues are
  # walked in order, so a global-only cap fills from football and never exercises the basketball
  # path or its mandatory &groups=50.
  max_records: 60
  max_records_per_league: 20
